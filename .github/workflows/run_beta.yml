name: Run Worker Beta

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # تثبيت FFmpeg و Node.js و Deno وحفظهم في الـ PATH تماماً كما في الصورة
      - name: Install FFmpeg, Node.js and Deno
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs curl
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Beta Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COOKIES_CONTENT: ${{ secrets.COOKIES_CONTENT }}
        run: |
          python bot_beta.py
