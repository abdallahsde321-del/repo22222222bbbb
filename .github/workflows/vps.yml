name: Continuous 24/7 VPS Runner 2

on:
  schedule:
    # بيشتغل بفارق 3 ساعات (الساعة 03:00, 09:00, 15:00, 21:00 UTC)
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

jobs:
  run-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools & SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs openssh-server
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          pip install -U yt-dlp
          
          # إنشاء مستخدم SSH بكلمة سر ثابتة
          sudo useradd -m runneruser || true
          echo "runneruser:123456" | sudo chpasswd
          sudo service ssh start

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Keep Alive Loop (4 Hours)
        run: |
          echo "VPS 2 is active and connected to Tailscale!"
          sleep 14400
